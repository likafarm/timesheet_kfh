name: kfh_server
description: "Сервер КФХ: API синхронизации и отчётов поверх MySQL (чистый Dart)"
publish_to: "none"
# Версию сервера читает /health: держать в согласии с lib/src/version.dart
# (проверяет test/version_test.dart).
version: 0.1.0

environment:
  sdk: ">=3.12.0 <4.0.0"

resolution: workspace

dependencies:
  crypto: ^3.0.6
  kfh_domain:
    path: ../packages/domain
  mysql_client_plus: ^0.1.3
  shelf: ^1.4.2
  shelf_router: ^1.1.4

dev_dependencies:
  http: ^1.2.0
  # Только для сверки схемы MySQL со схемой клиента (test/schema_test.dart).
  kfh_local_db:
    path: ../packages/local_db
  lints: ^6.0.0
  test: ^1.26.0
