name: kfh_server
description: "Сервер КФХ: API синхронизации и отчётов поверх MySQL (чистый Dart)"
publish_to: "none"
# Версию сервера читает /health: держать в согласии с lib/src/version.dart
# (проверяет test/version_test.dart).
version: 0.4.0

environment:
  sdk: ">=3.12.0 <4.0.0"

resolution: workspace

dependencies:
  crypto: ^3.0.6
  kfh_domain:
    path: ../packages/domain
  mysql_client_plus: ^0.1.3
  # Argon2id для паролей (уже приходит с mysql_client_plus).
  pointycastle: ^4.0.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  uuid: ^4.6.0

dev_dependencies:
  # Сквозной тест клиента: две базы drift в памяти (driftRuntimeOptions).
  drift: 2.34.0
  http: ^1.2.0
  # Только для сверки схемы MySQL со схемой клиента (test/schema_test.dart).
  kfh_local_db:
    path: ../packages/local_db
  # Клиент синхронизации — для сквозного теста клиент ↔ сервер.
  kfh_sync:
    path: ../packages/sync
  lints: ^6.0.0
  test: ^1.26.0
