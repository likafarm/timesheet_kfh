name: kfh_sync
description: "Синхронизация клиента КФХ с сервером: HTTP-клиент API, движок push/pull, журнал (чистый Dart)"
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.12.0 <4.0.0"

resolution: workspace

dependencies:
  cryptography: ^2.9.0
  # Импорт финансов пишет сотрудников с заданным uuid (EmployeesCompanion).
  drift: 2.34.0
  http: ^1.2.0
  kfh_domain:
    path: ../domain
  kfh_local_db:
    path: ../local_db

dev_dependencies:
  fake_async: ^1.3.1
  lints: ^6.0.0
  test: ^1.26.0
