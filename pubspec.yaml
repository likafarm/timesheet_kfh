name: kfx_time_tracking
description: "Учёт рабочего времени в КФХ"
publish_to: "none"
version: 1.5.1+11

environment:
  sdk: ">=3.12.0 <4.0.0"

# Dart workspace: пакеты в packages/ разрешаются вместе с приложением
workspace:
  - packages/domain
  - packages/local_db
  - packages/sync
  - server

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Доменная логика (модели, расчёт ЗП)
  kfh_domain:
    path: packages/domain

  # Управление состоянием
  provider: ^6.1.5

  # Локальная база (drift, схема v2) и перенос старой базы v8
  kfh_local_db:
    path: packages/local_db
  drift: 2.34.0
  sqlite3: ^3.4.0
  path: ^1.9.1

  # Иконки
  cupertino_icons: ^1.0.9

  # Форматирование дат и чисел
  intl: ^0.20.2

  # Локальное хранилище настроек
  shared_preferences: ^2.5.5

  path_provider: ^2.1.0

  # Печать PDF (табель и детальный отчёт)
  pdf: ^3.11.3
  printing: ^5.14.2
  package_info_plus: ^10.2.1

  # Синхронизация с сервером (вход, движок, первый вход). Токены входа
  # шифруются DPAPI Windows через win32/ffi (flutter_secure_storage требует
  # компонент ATL Visual Studio для сборки).
  kfh_sync:
    path: packages/sync
  http: ^1.2.0
  # Хранилище браузера (веб-версия: токены входа, журнал синхронизации)
  web: ^1.1.1
  win32: ^6.4.0
  ffi: ^2.1.0

  # Ссылка на новую версию программы (этап 4.8)
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Сверка web/sqlite3.wasm с контрольной суммой (test/web_assets_test.dart)
  crypto: ^3.0.7

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  # Шрифт интерфейса веб-версии (кириллица без загрузки шрифтов с серверов
  # Google); те же файлы — для печати PDF.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
