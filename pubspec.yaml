name: kfx_time_tracking
description: "Учёт рабочего времени в КФХ"
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.12.0 <4.0.0"

# Dart workspace: пакеты в packages/ разрешаются вместе с приложением
workspace:
  - packages/domain
  - packages/local_db
  - server

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Доменная логика (модели, расчёт ЗП)
  kfh_domain:
    path: packages/domain

  # Управление состоянием
  provider: ^6.1.5

  # Локальная база (drift, схема v2) и перенос старой базы v8
  kfh_local_db:
    path: packages/local_db
  drift: 2.34.0
  sqlite3: ^3.4.0
  path: ^1.9.1

  # Иконки
  cupertino_icons: ^1.0.9

  # Форматирование дат и чисел
  intl: ^0.20.2

  # Локальное хранилище настроек
  shared_preferences: ^2.5.5

  path_provider: ^2.1.0

  # Печать PDF (табель и детальный отчёт)
  pdf: ^3.11.3
  printing: ^5.14.2
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
